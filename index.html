
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Dash</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/imgs/flagicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Titan+One&family=Ultra&display=swap" rel="stylesheet">
</head>
<body>
    <h1><span><i>EMEA TICKET DASH</i></span></h1>
    <div id="message-board">
        <h2 id="race-winner"></h2>
        <h2><span id="race-results"></span></h2>
        <h2 id="race-message"></h2>
    </div>
    <div id="race-container"></div>
    <template id="race-template">
        <div class="race-lane">
            <div class="race-track">
                <div class="race-progress">
                    <div class="racer">
                        <img class="racer-avatar" alt="">
                        <div class="name-badge">
                            <i><span class="name"></span></i>
                        </div>
                    </div>
                </div>
                <div class="ticket-container">
                    <span class="tickets"></span>
                </div>
            </div>
        </div>
    </template>
</body>
</html>
